# Dev Container Docker Compose Configuration

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached
      # Preserve Codex login, configuration, skills and sessions across rebuilds.
      - codex-data:/home/vscode/.codex
      # Reuse installed gems after rebuilding the development container.
      - bundle-data:/usr/local/bundle

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Required by Codex bubblewrap to create its inner Linux sandbox.
    cap_add:
      - SYS_ADMIN
    # Docker default seccomp blocks bubblewrap mount/pivot_root syscalls.
    # The Codex workspace sandbox remains enabled inside the container.
    security_opt:
      - seccomp=unconfined

    environment:
      CODEX_HOME: "/home/vscode/.codex"

volumes:
  bundle-data:
    name: paycontractintegrator-bundle-data
  codex-data:
    name: paycontractintegrator-codex-data
    # Codex auth, configuration and sessions survive container recreation.
